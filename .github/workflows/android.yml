name: Android app

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'src/content.user.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk on-voie-tous.apk

      - uses: actions/upload-artifact@v4
        with:
          name: on-voie-tous-apk
          path: on-voie-tous.apk

      # Fixed download link for the phone: .../releases/download/android-latest/on-voie-tous.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest on-voie-tous.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Android app (build ${GITHUB_RUN_NUMBER})" \
            --notes "Latest Android build of On Voie Tous from ${GITHUB_SHA::7}."
